name: build-dex
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build classes.dex
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          AJ=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)/android.jar
          curl -fsSL -o xz.jar https://repo1.maven.org/maven2/org/tukaani/xz/1.10/xz-1.10.jar
          mkdir -p build/classes build/dex
          javac --release 8 -nowarn -cp "$AJ:xz.jar" -d build/classes ArchiveEntry.java ArchiveInputStream.java
          (cd build/classes && jar cf ../app.jar .)
          "$BT/d8" --min-api 21 --lib "$AJ" --output build/dex build/app.jar xz.jar
          ls -l build/dex
      - uses: actions/upload-artifact@v4
        with:
          name: classes-dex
          path: build/dex/classes.dex
          
